spring:
  application:
    name: yatrika-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} # Default to dev for local work
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  jackson:
    serialization:
      fail-on-empty-beans: false
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    mapper:
      accept-case-insensitive-enums: true
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 20
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 20
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true

yatrika:
  weather:
    api-key: ${WEATHER_API_KEY:d895ab23e750ef568431483e907bc4d7}
    base-url: https://api.openweathermap.org/data/2.5
  firebase:
    config-path: ${FIREBASE_CONFIG_PATH:classpath:firebase-service-account.json}

# You can also add specific logging for your new services here
logging:
  level:
    com.yatrika.notification: DEBUG